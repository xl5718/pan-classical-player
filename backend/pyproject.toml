[project]
name = "pan-classical-player"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "mutagen>=1.47",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.4",
  "pillow>=10.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]
desktop = ["pywebview>=5.1", "pyobjc-framework-MediaPlayer>=10.0", "pyinstaller>=6.5"]

[project.scripts]
pan = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
